<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Satellite — a space-inspired theme for VS Code">
  <title>Satellite</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E191F"/>
      <stop offset="1" stop-color="#1A262E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#ground)"/>

  <!-- star field, text.subtle at low opacity -->
  <g opacity=".45" fill="#7A9497">
    <circle cx="1105" cy="66" r="2.5"/><circle cx="1188" cy="140" r="2"/>
    <circle cx="1012" cy="204" r="2"/><circle cx="1230" cy="248" r="2.5"/>
    <circle cx="944" cy="96" r="1.8"/><circle cx="1152" cy="286" r="1.8"/>
    <circle cx="880" cy="188" r="1.6"/><circle cx="1268" cy="52" r="1.6"/>
  </g>

  <!-- the icon mark, blown up: same occlusion, same three colours -->
  <g transform="rotate(-18 1080 170)">
    <path d="M850 170 A 230 96 0 0 1 1310 170" fill="none" stroke="#2DB4B2" stroke-width="4" opacity=".6"/>
  </g>
  <circle cx="1080" cy="196" r="78" fill="#006C6B"/>
  <g transform="rotate(-18 1080 170)">
    <path d="M1310 170 A 230 96 0 0 1 850 170" fill="none" stroke="#2DB4B2" stroke-width="4" opacity=".6"/>
  </g>
  <circle cx="1246" cy="106" r="12" fill="#FFD077"/>

  <!-- lockup -->
  <g transform="translate(72 96)">
    <g transform="rotate(-28 64 64)">
      <path d="M12 64 A 52 22 0 0 1 116 64" fill="none" stroke="#2DB4B2" stroke-width="6"/>
    </g>
    <circle cx="64" cy="70" r="29" fill="#006C6B"/>
    <g transform="rotate(-28 64 64)">
      <path d="M116 64 A 52 22 0 0 1 12 64" fill="none" stroke="#2DB4B2" stroke-width="6"/>
    </g>
    <circle cx="93" cy="33" r="8.5" fill="#FFD077"/>
  </g>

  <text x="232" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="60" font-weight="600" letter-spacing="-2" fill="#E8EEF1">Satellite</text>
  <text x="234" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7A9497">A space-inspired theme for VS Code — dark, light and high contrast</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="234" y="222" width="95" height="26" rx="13" fill="#006C6B"/>
    <text x="250" y="240" fill="#E8EEF1">WCAG AA</text>
    <rect x="341" y="222" width="230" height="26" rx="13" fill="#233039"/>
    <text x="357" y="240" fill="#ACBAC0">colour-vision verified</text>
  </g>

  <!-- the six syntax roles in ladder order: doubles as a palette preview -->
  <g>
    <rect x="234" y="272" width="52" height="8" rx="4" fill="#FFD077"/>
    <rect x="292" y="272" width="52" height="8" rx="4" fill="#7AFAB6"/>
    <rect x="350" y="272" width="52" height="8" rx="4" fill="#40D0EE"/>
    <rect x="408" y="272" width="52" height="8" rx="4" fill="#D85CE1"/>
    <rect x="466" y="272" width="52" height="8" rx="4" fill="#F86E42"/>
    <rect x="524" y="272" width="52" height="8" rx="4" fill="#E8ACAA"/>
  </g>
</svg>
