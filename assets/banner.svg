    <rect x="350" y="272" width="52" height="8" rx="4" fill="#00DDF4"/>
    <rect x="408" y="272" width="52" height="8" rx="4" fill="#EC6B85"/>
    <rect x="466" y="272" width="52" height="8" rx="4" fill="#FF580C"/>
    <rect x="524" y="272" width="52" height="8" rx="4" fill="#C896FF"/>
