<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Satellite — a space-inspired theme for VS Code">
  <title>Satellite</title>
  <!-- Generated by scripts/brand.js — edit the palette, not this file. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0719"/>
      <stop offset="1" stop-color="#16142D"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#ground)"/>

  <g opacity=".5" fill="#8E87B0"><circle cx="999" cy="292" r="2.3"/><circle cx="992" cy="261" r="2.6"/><circle cx="732" cy="295" r="1.7"/><circle cx="800" cy="294" r="1.5"/><circle cx="909" cy="32" r="1.5"/><circle cx="726" cy="192" r="2.0"/><circle cx="806" cy="267" r="1.5"/><circle cx="1148" cy="64" r="1.4"/><circle cx="1182" cy="246" r="2.5"/><circle cx="1113" cy="34" r="1.8"/><circle cx="776" cy="203" r="1.9"/><circle cx="861" cy="239" r="1.8"/><circle cx="1188" cy="176" r="1.7"/><circle cx="953" cy="180" r="1.9"/><circle cx="860" cy="253" r="2.2"/><circle cx="891" cy="219" r="2.2"/><circle cx="918" cy="180" r="1.7"/><circle cx="739" cy="185" r="2.1"/><circle cx="949" cy="104" r="2.0"/><circle cx="735" cy="234" r="1.7"/><circle cx="759" cy="255" r="2.2"/></g>

  <!-- the mark, blown up: same occlusion, same three colours -->
  <g transform="rotate(-18 1080 170)">
    <path d="M850 170 A 230 96 0 0 1 1310 170" fill="none" stroke="#FF7C4C" stroke-width="4" opacity=".6"/>
  </g>
  <circle cx="1080" cy="196" r="78" fill="#A32605"/>
  <g transform="rotate(-18 1080 170)">
    <path d="M1310 170 A 230 96 0 0 1 850 170" fill="none" stroke="#FF7C4C" stroke-width="4" opacity=".6"/>
  </g>
  <circle cx="1246" cy="106" r="12" fill="#FFCB36"/>

  <!-- lockup -->
  <g transform="translate(72 96)">
    <!-- Orbit, far side. Drawn first so the planet occludes it. -->
    <g transform="rotate(-28 64 64)">
      <path d="M12 64 A 52 22 0 0 1 116 64" fill="none" stroke="#FF7C4C" stroke-width="6"/>
    </g>
    <!-- Planet -->
    <circle cx="64" cy="70" r="29" fill="#A32605"/>
    <!-- Orbit, near side, crossing in front. This single occlusion is what makes
         the ellipse read as an orbit rather than a flat ring. -->
    <g transform="rotate(-28 64 64)">
      <path d="M116 64 A 52 22 0 0 1 12 64" fill="none" stroke="#FF7C4C" stroke-width="6"/>
    </g>
    <!-- Satellite: the palette's second highlight -->
    <circle cx="93" cy="33" r="8.5" fill="#FFCB36"/>
  </g>

  <text x="232" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="60" font-weight="600" letter-spacing="-2" fill="#EEEDF9">Satellite</text>
  <text x="234" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#8E87B0">Five variants for VS Code — verified on every build</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="234" y="222" width="95" height="26" rx="13" fill="#A32605"/>
