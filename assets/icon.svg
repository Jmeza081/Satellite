<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Satellite">
  <title>Satellite</title>
  <!-- Ground: surface.deep. The icon is full-bleed, so it carries its own
       background rather than relying on the Marketplace tile. -->
  <rect width="128" height="128" fill="#0E191F"/>
  <!-- Orbit, far side. Drawn first so the planet occludes it. -->
  <g transform="rotate(-28 64 64)">
    <path d="M12 64 A 52 22 0 0 1 116 64" fill="none" stroke="#2DB4B2" stroke-width="6"/>
  </g>
  <!-- Planet: accent.solid -->
  <circle cx="64" cy="70" r="29" fill="#006C6B"/>
  <!-- Orbit, near side, crossing in front. This single occlusion is what makes
       the ellipse read as an orbit rather than a flat ring. -->
  <g transform="rotate(-28 64 64)">
    <path d="M116 64 A 52 22 0 0 1 12 64" fill="none" stroke="#2DB4B2" stroke-width="6"/>
  </g>
  <!-- Satellite: role.keyword, the palette's second colour -->
  <circle cx="93" cy="33" r="8.5" fill="#FFD077"/>
</svg>
