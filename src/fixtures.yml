        expect: role.tag,
        stack: [text.html.basic, meta.tag.any.html, entity.name.tag.html],
      }
    - {
        as: HTML attribute name,
        expect: role.type,
        stack: [text.html.basic, meta.tag.any.html, entity.other.attribute-name.html],
      }
    - {
        as: HTML attribute value,
        expect: role.string,
        stack: [text.html.basic, meta.tag.any.html, string.quoted.double.html],
      }
    - {
        as: CSS selector element,
        expect: role.tag,
        stack: [source.css, meta.selector.css, entity.name.tag.css],
      }
    - {
        as: CSS class selector,
        expect: role.type,
        stack: [source.css, meta.selector.css, entity.other.attribute-name.class.css],
      }
    - {
        as: CSS property name,
        expect: role.type,
        stack: [source.css, meta.property-list.css, support.type.property-name.css],
      }
    - {
        as: CSS property value,
        expect: role.constant,
        stack: [source.css, meta.property-value.css, support.constant.property-value.css],
      }
    - {
        as: CSS numeric value,
        expect: role.constant,
        stack: [source.css, constant.numeric.css],
      }
    - {
        as: CSS at-rule,
        expect: role.keyword,
        stack: [source.css, keyword.control.at-rule.media.css],
      }
    - {
        as: Tailwind @apply,
        expect: role.keyword,
        stack: [source.css, keyword.control.at-rule.apply.css],
      }
    - {
        as: SCSS variable,
        expect: role.variable,
        stack: [source.css.scss, variable.scss],
      }
    - {
        as: SCSS parent selector,
        expect: role.tag,
        stack: [source.css.scss, entity.other.attribute-name.parent-selector.css],
