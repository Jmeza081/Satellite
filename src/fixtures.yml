- family: Prose and config
  cases:
    - {
        as: Markdown heading,
        expect: role.tag,
        style: bold,
        stack: [text.html.markdown, markup.heading.markdown],
      }
    - {
        as: Markdown bold,
        expect: role.constant,
        style: bold,
        stack: [text.html.markdown, markup.bold.markdown],
      }
    - {
        as: Markdown link,
        expect: role.function,
        stack: [text.html.markdown, markup.underline.link.markdown],
      }
    - {
        as: Markdown inline code,
        expect: role.string,
        stack: [text.html.markdown, markup.inline.raw.markdown],
      }
    - {
        as: Markdown quote,
        expect: role.regexp,
        style: italic,
        stack: [text.html.markdown, markup.quote.markdown],
      }
    - {
        as: Shell variable,
        expect: role.tag,
        stack: [source.shell, variable.other.normal.shell],
      }
    - {
        as: Shell string,
        expect: role.string,
        stack: [source.shell, string.quoted.double.shell],
      }
    - {
        as: Dockerfile instruction,
        expect: role.keyword,
        stack: [source.dockerfile, keyword.other.special-method.dockerfile],
      }
    - {
        as: Dockerfile comment,
        expect: text.subtle,
        stack: [source.dockerfile, comment.line.number-sign.dockerfile],
      }
    - {
        as: Makefile target,
        expect: role.keyword,
        stack: [source.makefile, entity.name.function.target.makefile],
      }
    - { as: diff header, expect: text.subtle, stack: [source.diff, meta.diff.header] }
    - {
        as: diff inserted,
        expect: role.string,
        stack: [source.diff, markup.inserted.diff],
      }
    - {
        as: diff deleted,
        expect: role.invalid,
        stack: [source.diff, markup.deleted.diff],
      }
