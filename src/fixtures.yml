# =============================================================================
# Satellite — language coverage fixtures
# =============================================================================
#
# Each case is a scope stack a grammar would emit, and the token the theme is
# expected to paint it. scripts/fixtures.js resolves the stack against the built
# theme's rules — same matching and precedence VS Code uses — and fails the
# build when a case resolves to the wrong token or to nothing at all.
#
# This is what makes "supports Svelte" a checkable claim rather than an
# assertion. It catches the two failure modes that actually occur: a scope no
# rule matches, and a broad rule quietly outranking a specific one.
#
# It does NOT verify that a grammar emits a given scope — only that the theme
# handles it correctly if it does. Scope names below are taken from the
# published grammars rather than invented:
#
#   Vue      vuejs/language-tools      extensions/vscode/syntaxes/vue.tmLanguage.json
#   Svelte   sveltejs/language-tools   packages/svelte-vscode/syntaxes/svelte.tmLanguage.src.yaml
#   Astro    withastro/language-tools  packages/vscode/syntaxes/astro.tmLanguage.json
#   Prisma   prisma/language-tools     packages/vscode/syntaxes/prisma.tmLanguage.json
#   others   microsoft/vscode extensions/*/syntaxes
#
# `expect` names a token from tokens.yml. `style` is optional.

- family: TypeScript and JSX
  cases:
    - {
        as: line comment,
        expect: text.subtle,
        stack: [source.ts, comment.line.double-slash.ts],
      }
    - { as: block comment, expect: text.subtle, stack: [source.ts, comment.block.ts] }
    - { as: string, expect: role.string, stack: [source.ts, string.quoted.double.ts] }
    - {
        as: string quote,
        expect: role.string,
        stack:
          [source.ts, string.quoted.double.ts, punctuation.definition.string.begin.ts],
      }
    - {
        as: template literal,
        expect: role.string,
        stack: [source.ts, string.template.ts],
      }
    - { as: keyword, expect: role.keyword, stack: [source.ts, keyword.control.flow.ts] }
    - { as: storage type, expect: role.keyword, stack: [source.ts, storage.type.ts] }
    - {
        as: storage modifier,
        expect: role.keyword,
        stack: [source.ts, storage.modifier.ts],
      }
    - {
        as: function name,
        expect: role.function,
        stack: [source.ts, meta.function.ts, entity.name.function.ts],
      }
    - {
        as: method call,
        expect: role.function,
        stack: [source.ts, meta.function-call.ts, entity.name.function.ts],
      }
    - {
        as: type name,
        expect: role.type,
        style: italic,
        stack: [source.ts, entity.name.type.ts],
      }
    - {
        as: interface name,
        expect: role.type,
        style: italic,
        stack: [source.ts, entity.name.type.interface.ts],
      }
    - {
        as: type parameter,
        expect: role.constant,
        stack: [source.ts, meta.type.parameters.ts, entity.name.type.type-parameter.ts],
      }
    - {
        as: variable,
        expect: role.variable,
        stack: [source.ts, variable.other.readwrite.ts],
      }
    - {
        as: object property,
        expect: role.variable,
        stack: [source.ts, variable.other.property.ts],
      }
    - {
        as: parameter,
        expect: role.variable,
        style: italic,
        stack: [source.ts, meta.parameters.ts, variable.parameter.ts],
      }
    - {
        as: number,
        expect: role.constant,
        stack: [source.ts, constant.numeric.decimal.ts],
      }
    - {
        as: language constant,
        expect: role.constant,
        stack: [source.ts, constant.language.null.ts],
      }
    - {
        as: escape sequence,
        expect: role.tag,
        stack: [source.ts, string.quoted.double.ts, constant.character.escape.ts],
      }
    - { as: regexp, expect: role.regexp, stack: [source.ts, string.regexp.ts] }
    - { as: brace, expect: role.punctuation, stack: [source.ts, meta.brace.round.ts] }
    - {
        as: JSX tag name,
        expect: role.tag,
        stack: [source.tsx, meta.tag.tsx, entity.name.tag.tsx],
      }
    - {
        as: JSX attribute,
        expect: role.type,
        stack: [source.tsx, meta.tag.tsx, entity.other.attribute-name.tsx],
      }
    - {
        as: JSX expression braces,
        expect: role.function,
        stack: [source.tsx, meta.tag.tsx, punctuation.section.embedded.begin.tsx],
      }
    - { as: invalid token, expect: role.invalid, stack: [source.ts, invalid.illegal.ts] }
    - { as: this, expect: role.constant, stack: [source.ts, variable.language.this.ts] }

- family: HTML, CSS and SCSS
