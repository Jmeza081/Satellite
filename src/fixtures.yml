    - {
        as: SCSS mixin at-rule,
        expect: role.keyword,
        stack: [source.css.scss, keyword.control.at-rule.mixin.scss],
      }

- family: Vue single-file components
  cases:
    - {
        as: template tag,
        expect: role.tag,
        stack: [source.vue, meta.tag.vue, entity.name.tag.html.vue],
      }
    - {
        as: attribute name,
        expect: role.type,
        stack: [source.vue, meta.tag.vue, entity.other.attribute-name.html.vue],
      }
    - {
        as: "v-if directive",
        expect: role.keyword,
        stack:
          [
            source.vue,
            meta.attribute.directive.control.vue,
            keyword.control.conditional.vue,
          ],
      }
    - {
        as: "v-for directive",
        expect: role.keyword,
        stack:
          [source.vue, meta.attribute.directive.control.vue, keyword.control.loop.vue],
      }
    - {
        as: "bind shorthand :",
        expect: role.type,
        stack:
          [
            source.vue,
            meta.attribute.directive.vue,
            punctuation.attribute-shorthand.bind.html.vue,
          ],
      }
    - {
        as: "event shorthand @",
        expect: role.type,
        stack:
          [
            source.vue,
            meta.attribute.directive.vue,
            punctuation.attribute-shorthand.event.html.vue,
          ],
      }
    - {
        as: "slot shorthand #",
        expect: role.type,
        stack:
          [
            source.vue,
            meta.attribute.directive.vue,
            punctuation.attribute-shorthand.slot.html.vue,
          ],
      }
    - {
        as: interpolation braces,
        expect: role.punctuation,
        stack: [source.vue, punctuation.definition.interpolation.begin.html.vue],
      }

- family: Svelte
  cases:
    - {
        as: element tag,
        expect: role.tag,
        stack: [source.svelte, meta.tag.start.svelte, entity.name.tag.svelte],
      }
    - {
        as: component tag,
        expect: role.tag,
        stack: [source.svelte, meta.tag.start.svelte, support.class.component.svelte],
      }
    - {
        as: attribute name,
        expect: role.type,
        stack: [source.svelte, meta.tag.start.svelte, entity.other.attribute-name.svelte],
      }
    - {
        as: "{#if} block keyword",
        expect: role.keyword,
        stack:
          [source.svelte, meta.embedded.block.svelte, keyword.control.conditional.svelte],
      }
    - {
        as: "{#each} flow keyword",
        expect: role.keyword,
        stack: [source.svelte, meta.embedded.block.svelte, keyword.control.flow.svelte],
      }
    - {
        as: block comment,
        expect: text.subtle,
        stack: [source.svelte, comment.block.svelte],
      }
    - {
        as: numeric literal,
        expect: role.constant,
        stack: [source.svelte, constant.numeric.decimal.svelte],
      }

