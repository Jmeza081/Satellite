# =============================================================================
# Satellite Orbit High Contrast — dark palette
# =============================================================================
#
# Same token structure and the same hues as Orbit, held to a higher bar:
#
#   · every text role clears WCAG AAA (7:1) rather than AA
#   · the decorative exemptions are withdrawn — indent guides, whitespace and
#     rulers have to meet 3:1 like any other meaningful boundary
#   · panel seams are visible lines rather than dark ones, which is the point of
#     a high-contrast theme and the opposite of what Orbit does
#
# Those requirements are enforced by the `satellite-orbit-hc` entry under
# `overrides` in src/a11y.yml, so the "high contrast" label means something a
# build can check rather than something a README asserts.
#
# The role values were solved jointly against the same adjacency contract as
# the other themes; the ground is darker, which buys back the headroom the
# higher contrast floor costs.

surface:
  deep: oklch(0.100 0.014 236)
  base: oklch(0.150 0.018 238)
  raised: oklch(0.220 0.022 238)
  overlay: oklch(0.290 0.026 238)

border:
  # Inverted from Orbit on purpose. High contrast means visible structure, so
  # panels are separated by a light line rather than a dark seam.
  seam: oklch(0.560 0.024 238)
  soft: oklch(0.500 0.022 238)
  strong: oklch(0.680 0.026 238)

wash:
  selection: alpha(accent.base, 55)
  selectionSoft: alpha(accent.base, 33)
  lineHighlight: alpha(text.default, 14)
  dropTarget: alpha(accent.base, 44)
  findMatch: alpha(accent.base, 77)
  findOther: alpha(accent.base, 3D)
  rangeHighlight: alpha(accent.base, 2E)
  added: alpha(vcs.added, 33)
  deleted: alpha(vcs.deleted, 33)
  modified: alpha(vcs.modified, 33)

text:
  default: oklch(0.985 0.004 230)
  muted: oklch(0.860 0.016 225)
  subtle: oklch(0.680 0.060 186) # comments — 7.5:1, AAA
  faint: oklch(0.540 0.022 238) # indent guides — 3.9:1, no longer exempt
  onAccent: text.default
  onFill: surface.base

role:
  punctuation: oklch(0.820 0.035 247)
  variable: oklch(0.740 0.088 23)
  string: oklch(0.937 0.139 165)
  keyword: oklch(0.866 0.102 75)
  function: oklch(0.839 0.147 205)
  type: oklch(0.770 0.078 182)
  constant: oklch(0.735 0.181 45)
  tag: oklch(0.732 0.185 316)
  regexp: oklch(0.827 0.160 114)
  invalid: oklch(0.712 0.194 30)

accent:
  base: oklch(0.800 0.100 194)
  solid: oklch(0.340 0.090 194) # holds text.default at 11:1

status:
  error: oklch(0.712 0.194 30)
  warning: oklch(0.850 0.140 70)
  info: oklch(0.820 0.110 235)
  success: oklch(0.850 0.150 158)

vcs:
  added: oklch(0.850 0.150 158)
  modified: oklch(0.866 0.130 75)
  deleted: oklch(0.750 0.180 25)
  conflicting: oklch(0.780 0.170 45)
  ignored: oklch(0.620 0.020 225)
  untracked: oklch(0.800 0.130 158)

bracket:
  one: oklch(0.880 0.130 75)
  two: oklch(0.760 0.180 316)
  three: oklch(0.850 0.130 205)
  four: oklch(0.780 0.180 45)
  five: oklch(0.920 0.140 165)
  six: oklch(0.800 0.140 255)

ansi:
  # Even here black cannot reach AAA and stay black; it is held to the same
  # documented `dim` floor as Orbit's, just higher.
  black: oklch(0.520 0.024 238)
  red: oklch(0.712 0.194 30)
  green: oklch(0.830 0.150 158)
  yellow: oklch(0.880 0.135 82)
  blue: oklch(0.780 0.140 255)
  magenta: oklch(0.760 0.180 316)
  cyan: oklch(0.820 0.110 196)
  white: oklch(0.930 0.010 230)
  brightBlack: oklch(0.680 0.024 238)
  brightRed: oklch(0.800 0.170 25)
  brightGreen: oklch(0.920 0.140 158)
  brightYellow: oklch(0.950 0.120 85)
  brightBlue: oklch(0.860 0.110 255)
  brightMagenta: oklch(0.850 0.150 320)
  brightCyan: oklch(0.900 0.100 196)
  brightWhite: oklch(1 0 230)
