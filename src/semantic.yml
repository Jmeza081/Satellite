# =============================================================================
# Satellite — semantic token colours
# =============================================================================
#
# Semantic highlighting colours what the language server actually resolved,
# rather than what the grammar guessed. A TextMate rule cannot reliably tell a
# local variable from a parameter, a class from a namespace, or a real constant
# from an ALL_CAPS variable; a semantic token can, because the compiler already
# worked it out.
#
# These rules apply to every language with a semantic token provider —
# TypeScript, JavaScript, Go, Rust, C#, Java, Python and others — so a single
# block here fixes all of them at once. Anything the server does not classify
# falls through to the TextMate rules in syntax.yml.
#
# Selector syntax:  (*|tokenType)(.tokenModifier)*(:tokenLanguage)?
# More specific selectors win; a modifier makes a selector more specific.
#
# Reference:
# https://code.visualstudio.com/api/language-extensions/semantic-highlight-guide

# Turning this on changes how every server-backed file looks. It is on because
# the corrections below are the whole point of the feature: without it the theme
# is colouring a guess.
enabled: true

rules:
  # ---------------------------------------------------------------------------
  # Types
  #
  # Everything that names a type takes the teal, italic, matching the TextMate
  # `Types` rule so a file looks the same whether or not the server has
  # reported yet.
  # ---------------------------------------------------------------------------
  class: { foreground: role.type, fontStyle: italic }
  interface: { foreground: role.type, fontStyle: italic }
  enum: { foreground: role.type, fontStyle: italic }
  struct: { foreground: role.type, fontStyle: italic }
  type: { foreground: role.type, fontStyle: italic }
  typeParameter: { foreground: role.type, fontStyle: italic }

  # Namespaces and modules are containers rather than types, and share the tag
  # colour with the symbol icons already used for them in the outline.
  namespace: role.tag

  # ---------------------------------------------------------------------------
  # Callables
  # ---------------------------------------------------------------------------
  function: role.function
  method: role.function

  # Rust and C macros expand into code rather than being called, so they read as
  # closer to a tag than a function.
  macro: role.tag

  # ---------------------------------------------------------------------------
  # Values
  #
  # This is the group TextMate cannot get right. A grammar sees `MAX_RETRIES`
  # and guesses "constant" from the casing; the server knows whether it is
  # actually immutable. The 2019 theme carried explicit `variable.other.constant`
  # overrides for js, ts and tsx to paper over exactly this, and those can now
  # go away.
  # ---------------------------------------------------------------------------
  variable: role.variable
  property: role.variable
  parameter: { foreground: role.variable, fontStyle: italic }

  variable.readonly: role.constant
  property.readonly: role.constant
  enumMember: role.constant

  # Built-ins — `Math`, `console`, `Promise`, `println!`. Marked by the server
  # rather than guessed from a support.* scope.
  variable.defaultLibrary: { foreground: role.type, fontStyle: italic }
  property.defaultLibrary: { foreground: role.type, fontStyle: italic }
  class.defaultLibrary: { foreground: role.type, fontStyle: italic }
  function.defaultLibrary: role.function
  method.defaultLibrary: role.function

  # ---------------------------------------------------------------------------
  # Everything else
  # ---------------------------------------------------------------------------
  keyword: role.keyword
  string: role.string
  number: role.constant
  regexp: role.regexp
  comment: text.subtle
  operator: role.punctuation
  decorator: role.string
  event: role.keyword
  label: role.constant

  # ---------------------------------------------------------------------------
  # Modifiers that apply across every type
  # ---------------------------------------------------------------------------

  # Deprecated symbols are struck through rather than recoloured, so the
  # signal does not depend on colour perception and does not cost a hue.
  "*.deprecated": { fontStyle: strikethrough }

  # Doc comments sit slightly above ordinary comments — they are content, not
  # commentary on content.
  "*.documentation": text.muted
