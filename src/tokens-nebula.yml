# =============================================================================
# Satellite Nebula — dark palette
# =============================================================================
#
# Neon at night. A violet ground, dark enough to sit under saturated colour,
# lit by blood orange and gold.
#
# Same token structure, same shared ui.yml and syntax.yml, and the same
# accessibility contract as every other variant — `yarn verify` holds this file
# to WCAG AA on every text role and to deltaE 12 on every adjacency pair in
# src/a11y.yml. Nothing below is exempted or overridden.
#
# -----------------------------------------------------------------------------
# ONE GROUND, NOT TWO
# -----------------------------------------------------------------------------
# All five surfaces sit in the violet family, on the same short 285°–302° arc.
# This is the rule tokens.yml sets out, and the reason it gives holds here too:
# a ground that changes hue underneath you reads as a mistake rather than as
# depth. An earlier draft put the editor on blue at 265° and the chrome on
# purple at 295°, and the seam between them was the first thing anyone saw.
#
# Depth comes from lightness instead, which is the axis that survives colour
# vision deficiency anyway:
#
#   0.152  surface.deep      activity bar, side bar, panel, terminal   302°
#   0.208  surface.base      the editor                                285°
#   0.265  surface.raised    dropdowns, hover, secondary buttons       288°
#   0.315  surface.overlay   selected rows, badges, sticky scroll      292°
#
# The editor is lighter than the chrome around it, so the code sits forward
# without a hue change doing the work.
#
# The ground is also darker than the first draft, and deliberately so. Neon is a
# contrast effect before it is a saturation one — the same colour that glows on
# this ground looks like poster paint on a lighter one. Dropping the editor to
# 0.208 is what buys the syntax roles the room to run at full chroma and still
# clear AA.
#
# -----------------------------------------------------------------------------
# SATURATION
# -----------------------------------------------------------------------------
# Most syntax roles are pushed to or past the sRGB boundary for their hue at
# their lightness. Values below that read as impossibly high — chroma 0.23 at
# 158°, say — are not errors: scripts/color.js binary-searches the largest
# in-gamut chroma and clamps, so asking past the edge is how you ask for "as
# saturated as this hue gets here". Keywords, strings, functions, types,
# constants and variables all clamp; none of them reaches the chroma it asks
# for, and the number to read is the hex, not the request.
#
# Three roles are deliberately held below the edge, and are marked where they
# are declared: comments, punctuation and tags. The first two repeat on every
# line, and a file where every glyph glows is a file you cannot read. Tags were
# the third once identifiers moved to lilac — see the note on role.tag.
#
# -----------------------------------------------------------------------------
# WHERE THE WARM COLOURS GO
# -----------------------------------------------------------------------------
# Blood orange is the accent — cursor, focus ring, links, active tab indicator,
# selection wash. It is the colour a screenshot is recognised by, and it is the
# one hue on screen with no neighbour anywhere near it.
#
# It is deliberately not the status bar. See `chrome.statusBar` below: the
# accent is used where it marks something the eye is looking for, not as a band
# that is lit all day. The bar still goes orange while a debug session runs.
#
# Gold is the second highlight, and it lands where the eye goes next: keywords,
# warnings, modified files in the gutter, the outermost bracket pair.
#
# The warm band carries exactly three roles, spread as far apart as it can hold
# them: tags at 10°, constants at 39°, keywords at 88°. That is the ceiling, not
# a stylistic choice. Orange and gold both collapse toward the same yellow under
# protanopia and deuteranopia, so warm roles have to be bought apart with
# lightness as well as hue, and there is only so much of that to go around.
#
# Strings, functions and types are therefore cool, where they stay separable
# from the warm three under every simulation and read as the cloud the warm
# colours are burning through. Identifiers are lilac, which puts them on the
# ground's own hue rather than in either camp.
#
# -----------------------------------------------------------------------------
# THE LADDER
# -----------------------------------------------------------------------------
# Lightness is assigned, not incidental, for the reason documented at length in
# tokens.yml: under colour-vision simulation hue differences collapse and
# lightness differences survive. Reading order, dimmest to brightest:
#
#   0.430  text.faint        indent guides           decorative
#   0.645  text.subtle       comments                violet, recedes
#   0.680  role.constant     numbers, constants      BLOOD ORANGE
#   0.690  role.tag          JSX/HTML tags           dusty rose
#   0.710  role.type         types                   + italic
#   0.760  role.variable     identifiers             lilac, quiet
#   0.778  role.punctuation  braces, semicolons      structural, quiet
#   0.820  role.function     calls and declarations  neon cyan
#   0.865  role.keyword      keywords, storage       GOLD
#   0.905  role.string       string literals         neon mint
#   0.950  text.default      plain text
#
# Four constraints in here are tighter than they look, and all four were solved
# by search against the verifier rather than by eye. They are the reason several
# values are oddly specific; moving any one of them tends to break another. The
# margin quoted is the worst of the three simulations, against a floor of 12.
#
#   · comments are violet and punctuation is slate — deltaE 16. They are the two
#     lowest-chroma colours in the palette, so nearly all of their separation is
#     lightness. Putting punctuation on the surface violet, which is the obvious
#     move for a purple theme, drops the pair through the floor; so does closing
#     the 0.133 lightness gap between them.
#   · functions against types — deltaE 16. Neon cyan against teal, 0.110 of
#     lightness apart, with italic on the type as a second, non-colour cue.
#   · functions against strings — deltaE 16. Cyan against mint, both cool, both
#     bright; this is the pair that stops the cool side taking another role.
#   · constants against tags — deltaE 23, and worth understanding before anyone
#     re-saturates the tag. Tritanopia collapses the blue/yellow axis, so a warm
#     tag and a warm constant both land on red. When the tag was a neon magenta
#     at the gamut edge this pair measured 5, against a floor of 12. The dusty
#     rose has room because it is not at the edge, not because the hazard went
#     away.
# =============================================================================

# -----------------------------------------------------------------------------
# Surfaces — one violet family, separated by lightness
# -----------------------------------------------------------------------------
surface:
  deep: oklch(0.152 0.038 302) # activity bar, side bar, panel, terminal, widgets
  base: oklch(0.208 0.048 285) # editor
  raised: oklch(0.265 0.055 288) # dropdowns, hover states, secondary buttons
  overlay: oklch(0.315 0.060 292) # selected rows, badges, sticky scroll

border:
  # Satellite separates panels with a line darker than either surface rather
  # than a lighter one, and that is a large part of how the theme reads. Kept,
  # and taken to the deep end of the violet arc.
  seam: oklch(0.100 0.030 302)
  soft: oklch(0.340 0.052 290) # hairlines within a surface
  strong: oklch(0.490 0.058 290) # visible boundaries where 1.4.11 applies

# -----------------------------------------------------------------------------
# Washes — translucent fills. Alpha is a hex byte, as in VS Code's #RRGGBBAA.
#
# Selection, find and drop targets all derive from accent.base, so the whole
# interaction layer is blood orange over violet.
# -----------------------------------------------------------------------------
wash:
  selection: alpha(accent.base, 3D) # editor and workbench text selection
  selectionSoft: alpha(accent.base, 22) # other occurrences of the selection
  lineHighlight: alpha(text.default, 0C) # the line under the cursor
  dropTarget: alpha(accent.base, 33) # drag-and-drop targets
  findMatch: alpha(accent.base, 66) # the current search hit
  findOther: alpha(accent.base, 2E) # the other search hits
  rangeHighlight: alpha(accent.base, 1F) # quick-open and find ranges
  added: alpha(vcs.added, 26)
  deleted: alpha(vcs.deleted, 26)
  modified: alpha(vcs.modified, 26)

# -----------------------------------------------------------------------------
# Text
# -----------------------------------------------------------------------------
text:
  # Carries a trace of the surface violet rather than being neutral, so it
  # settles onto the ground instead of floating in front of it.
  default: oklch(0.950 0.016 290)
  muted: oklch(0.790 0.028 290) # secondary UI text, section headers
  subtle: oklch(0.645 0.060 292) # comments and line numbers
  faint: oklch(0.430 0.042 290) # indent guides and whitespace (decorative)

  # onAccent sits on accent.solid, a deep blood orange, so it stays light.
  # onFill sits on a bright status fill and has to be dark. See tokens.yml for
  # why these are two tokens and not one.
  onAccent: text.default
  onFill: surface.deep

# -----------------------------------------------------------------------------
# Syntax roles — at the gamut edge except where marked
# -----------------------------------------------------------------------------
role:
  # Slate, not violet. Punctuation is adjacent to comments in the contract, and
  # both are low-chroma; putting this on the surface violet collapses the pair.
  # Held quiet on purpose: braces and semicolons are structure, not signal.
  punctuation: oklch(0.778 0.055 225)

  # Lilac, so identifiers belong to the ground rather than adding a fourth accent
  # to compete with the neon. Held below the chroma of the signalling roles on
  # purpose — a neon identifier on every line is what makes a theme unreadable.
  #
  # This replaced a warm rose that cleared the contract while sitting deltaE 6
  # from the keyword gold under deuteranopia — `const x` with the two words
  # nearly the same colour. Variables and keywords are not a declared adjacent
  # pair in a11y.yml, so nothing was checking.
  #
  # That pair is worth adding to the contract, but it cannot simply be switched
  # on: measured today it is 9.2 on Satellite and 10.2 on Daybreak under
  # tritanopia, so declaring it would fail two shipped themes until their warm
  # roles are re-graded. Nebula measures 23.
  variable: oklch(0.760 0.170 305)

  string: oklch(0.905 0.230 158) # neon mint, clamped to the edge
  keyword: oklch(0.865 0.200 88) # neon gold, clamped to the edge
  function: oklch(0.820 0.175 208) # neon cyan, clamped to the edge

  # Split from function and given italic as a second, non-colour cue, since
  # teal and cyan stay close under every simulation.
  type: oklch(0.710 0.130 178)

  constant: oklch(0.680 0.220 39) # neon blood orange, clamped to the edge

  # Dusty rose, and one of the three roles deliberately kept off the gamut edge.
  #
  # This was a neon magenta until identifiers moved to lilac, at which point the
  # two sat deltaE 7 apart — and in JSX they are adjacent constantly, as in
  # `<Panel value={dv} />`. The obvious repair does not work: softening the
  # magenta pulls it toward the lilac's lightness and lands it at 6. Moving the
  # hue across to the warm side is what buys the separation, and it measures 48.
  #
  # Chroma is held at 0.160 rather than pushed. At the edge this collides with
  # the blood orange of constants under tritanopia; see the ladder note above.
  tag: oklch(0.690 0.160 10)
  regexp: oklch(0.935 0.160 132)
  invalid: oklch(0.680 0.250 22)

# -----------------------------------------------------------------------------
# Accent — the blood orange that makes a screenshot recognisably Nebula
#
# Two stops: one that can be read as text and drawn as a hairline on the ground,
# and one dark enough to hold text.default as a fill.
# -----------------------------------------------------------------------------
accent:
  base: oklch(0.730 0.215 40) # cursor, links, active borders, focus rings
  solid: oklch(0.470 0.165 34) # status bar and button fills

# -----------------------------------------------------------------------------
# Chrome — large UI fills that are not signalling anything
# -----------------------------------------------------------------------------
chrome:
  # The status bar at rest, and the one place Nebula does not use its accent.
  # A blood orange band across the bottom of the window is the loudest thing on
  # screen and it is on permanently, which reads as an alarm that never clears.
  # This is the raised surface instead, so the bar is chrome until it has
  # something to say — debugging, errors, warnings and offline all keep their
  # own colour keys and still take over the bar when they fire.
  statusBar: surface.raised

# -----------------------------------------------------------------------------
# Diagnostics and version control
# -----------------------------------------------------------------------------
status:
  error: oklch(0.680 0.250 22)
  warning: oklch(0.810 0.180 78) # gold
  info: oklch(0.760 0.150 262)
  success: oklch(0.800 0.200 158)

vcs:
  added: oklch(0.790 0.200 158)
  modified: oklch(0.830 0.180 85) # gold
  deleted: oklch(0.710 0.230 22)
  conflicting: oklch(0.730 0.215 40)
  ignored: oklch(0.520 0.035 290)
  untracked: oklch(0.750 0.180 158)

# -----------------------------------------------------------------------------
# Bracket pair colourisation
#
# Six stops spread across hue and lightness, opening on gold so the outermost
# pair is the one that reads first.
# -----------------------------------------------------------------------------
bracket:
  one: oklch(0.855 0.190 88)
  two: oklch(0.730 0.250 335)
  three: oklch(0.820 0.160 205)
  four: oklch(0.750 0.210 40)
  five: oklch(0.880 0.200 158)
  six: oklch(0.770 0.180 272)

# -----------------------------------------------------------------------------
# Terminal ANSI
#
# Derived from Nebula's own hues; every colour clears 4.5:1 on surface.deep.
# -----------------------------------------------------------------------------
ansi:
  # ANSI black cannot reach AA on a dark ground without ceasing to be black, so
  # it is held to the documented `dim` floor in src/a11y.yml instead — high
  # enough that anything printing in black is unambiguously visible.
  black: oklch(0.448 0.034 292)
  # brightBlack is what CLI tools reach for when they print dim body text, so it
  # is held to full AA.
  brightBlack: oklch(0.580 0.036 292)
  red: oklch(0.680 0.250 22)
  green: oklch(0.790 0.200 158)
  yellow: oklch(0.830 0.180 85)
  blue: oklch(0.720 0.190 265)
  magenta: oklch(0.710 0.260 335)
  cyan: oklch(0.760 0.150 200)
  white: oklch(0.890 0.016 290)
  brightRed: oklch(0.760 0.220 25)
  brightGreen: oklch(0.890 0.200 158)
  brightYellow: oklch(0.915 0.170 88)
  brightBlue: oklch(0.810 0.160 265)
  brightMagenta: oklch(0.810 0.210 335)
  brightCyan: oklch(0.855 0.140 200)
  brightWhite: oklch(0.980 0.010 290)
