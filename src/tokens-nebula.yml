# =============================================================================
# Satellite Nebula — dark palette
# =============================================================================
#
# A deep blue and purple ground, lit by blood orange and gold.
#
# Same token structure, same shared ui.yml and syntax.yml, and the same
# accessibility contract as every other variant — `yarn verify` holds this file
# to WCAG AA on every text role and to deltaE 12 on every adjacency pair in
# src/a11y.yml. Nothing below is exempted or overridden.
#
# -----------------------------------------------------------------------------
# THE GROUND IS TWO HUES, ON PURPOSE
# -----------------------------------------------------------------------------
# Orbit keeps all five surfaces on a single 238° axis, because there the drift
# between 218° and 279° was incidental and read as a mistake — panels that went
# slightly purple next to the editor for no stated reason.
#
# Here the drift IS the design, so it is monotonic and declared rather than
# incidental: the editor is the bluest surface at 265°, and every surface
# further out or further up walks toward purple, ending at 295° for the chrome
# and the overlays. You read code on deep blue, inside a purple frame.
#
#   295°  surface.deep      activity bar, side bar, panel, terminal   purple
#   288°  surface.overlay   selected rows, badges, sticky scroll
#   278°  surface.raised    dropdowns, hover, secondary buttons
#   265°  surface.base      the editor                                blue
#
# A reviewer changing one of these should move it along that ramp, not off it.
#
# -----------------------------------------------------------------------------
# WHERE THE WARM COLOURS GO
# -----------------------------------------------------------------------------
# Blood orange is the accent — cursor, focus ring, links, active tab indicator,
# selection wash, status bar fill. It is the colour a screenshot is recognised
# by, and it is the one hue on screen with no neighbour anywhere near it.
#
# Gold is the second highlight, and it lands where the eye goes next: keywords,
# warnings, modified files in the gutter, the outermost bracket pair.
#
# The remaining syntax roles are cool, and that is a constraint rather than a
# preference. Ten roles cannot be drawn from two adjacent warm hues and still
# clear deltaE 12 under protanopia and deuteranopia — orange and gold both
# collapse toward the same yellow, so any third or fourth warm role collapses
# with them. Strings, functions and types therefore sit on the cool side of the
# wheel, where they stay separable from the warm pair under every simulation and
# read as the cloud the warm colours are burning through.
#
# -----------------------------------------------------------------------------
# THE LADDER
# -----------------------------------------------------------------------------
# Lightness is assigned, not incidental, for the reason documented at length in
# tokens.yml: under colour-vision simulation hue differences collapse and
# lightness differences survive. Reading order, dimmest to brightest:
#
#   0.445  text.faint        indent guides           decorative
#   0.655  text.subtle       comments                violet, recedes
#   0.680  role.tag          JSX/HTML tags
#   0.688  role.type         types                   + italic
#   0.700  role.constant     numbers, constants      BLOOD ORANGE
#   0.770  role.punctuation  braces, semicolons      structural, quiet
#   0.795  role.function     calls and declarations
#   0.800  role.variable     identifiers             near-foreground
#   0.870  role.keyword      keywords, storage       GOLD
#   0.910  role.string       string literals
#   0.945  text.default      plain text
#
# Three constraints in here are tighter than they look, and all three were
# solved against the verifier rather than by eye. They are the reason several
# values are oddly specific; moving any one of them tends to break another.
#
#   · comments are violet and punctuation is slate — deuteranopia deltaE 14.
#     They are the two lowest-chroma colours in the palette, so nearly all of
#     their separation is lightness. Putting punctuation on the surface violet,
#     which is the obvious move for a purple theme, drops this pair through the
#     floor; so does closing the 0.115 lightness gap between them.
#   · strings against variables — deuteranopia deltaE 13. Jade and rose both
#     collapse toward yellow when the green channel goes, which is why the
#     string chroma is high and its lightness sits well clear of the variable.
#   · functions and variables sit 0.005 apart in lightness, as they do in
#     Orbit, and are held apart entirely by hue across the blue/yellow axis.
# =============================================================================

# -----------------------------------------------------------------------------
# Surfaces — the blue-to-purple ramp described above
# -----------------------------------------------------------------------------
surface:
  deep: oklch(0.185 0.040 295) # activity bar, side bar, panel, terminal, widgets
  base: oklch(0.238 0.050 265) # editor
  raised: oklch(0.288 0.052 278) # dropdowns, hover states, secondary buttons
  overlay: oklch(0.335 0.056 288) # selected rows, badges, sticky scroll

border:
  # Satellite separates panels with a line darker than either surface rather
  # than a lighter one, and that is a large part of how the theme reads. Kept,
  # and taken to the purple end of the ramp.
  seam: oklch(0.125 0.032 296)
  soft: oklch(0.355 0.048 282) # hairlines within a surface
  strong: oklch(0.500 0.052 282) # visible boundaries where 1.4.11 applies

# -----------------------------------------------------------------------------
# Washes — translucent fills. Alpha is a hex byte, as in VS Code's #RRGGBBAA.
#
# Selection, find and drop targets all derive from accent.base, so the whole
# interaction layer is blood orange over blue.
# -----------------------------------------------------------------------------
wash:
  selection: alpha(accent.base, 3D) # editor and workbench text selection
  selectionSoft: alpha(accent.base, 22) # other occurrences of the selection
  lineHighlight: alpha(text.default, 0C) # the line under the cursor
  dropTarget: alpha(accent.base, 33) # drag-and-drop targets
  findMatch: alpha(accent.base, 66) # the current search hit
  findOther: alpha(accent.base, 2E) # the other search hits
  rangeHighlight: alpha(accent.base, 1F) # quick-open and find ranges
  added: alpha(vcs.added, 26)
  deleted: alpha(vcs.deleted, 26)
  modified: alpha(vcs.modified, 26)

# -----------------------------------------------------------------------------
# Text
# -----------------------------------------------------------------------------
text:
  # Carries a trace of the surface violet rather than being neutral, so it
  # settles onto the ground instead of floating in front of it.
  default: oklch(0.945 0.014 288)
  muted: oklch(0.780 0.024 288) # secondary UI text, section headers
  subtle: oklch(0.655 0.055 292) # comments and line numbers
  faint: oklch(0.445 0.038 288) # indent guides and whitespace (decorative)

  # onAccent sits on accent.solid, a deep blood orange, so it stays light.
  # onFill sits on a bright status fill and has to be dark. See tokens.yml for
  # why these are two tokens and not one.
  onAccent: text.default
  onFill: surface.deep

# -----------------------------------------------------------------------------
# Syntax roles
# -----------------------------------------------------------------------------
role:
  # Slate, not violet. Punctuation is adjacent to comments in the contract, and
  # both are low-chroma; putting this on the surface violet collapses the pair.
  punctuation: oklch(0.770 0.048 224)

  # The most common token in a file, so it sits close to plain text and carries
  # only enough warmth to belong to the blood orange family.
  variable: oklch(0.800 0.070 22)

  string: oklch(0.910 0.160 163)
  keyword: oklch(0.870 0.140 88) # gold
  function: oklch(0.795 0.115 208)

  # Split from function and given italic as a second, non-colour cue, since
  # teal and aqua stay close under every simulation.
  type: oklch(0.688 0.095 192)

  constant: oklch(0.700 0.190 36) # blood orange
  # Chroma is pushed harder than the other roles: in JSX, tags and functions sit
  # inches apart, both are word-shaped, and magenta and aqua lose most of their
  # separation under deuteranopia. The extra chroma buys that pair back.
  tag: oklch(0.680 0.220 332)
  regexp: oklch(0.940 0.115 122)
  invalid: oklch(0.665 0.205 20)

# -----------------------------------------------------------------------------
# Accent — the blood orange that makes a screenshot recognisably Nebula
#
# Two stops: one that can be read as text and drawn as a hairline on the ground,
# and one dark enough to hold text.default as a fill.
# -----------------------------------------------------------------------------
accent:
  base: oklch(0.720 0.175 40) # cursor, links, active borders, focus rings
  solid: oklch(0.470 0.140 34) # status bar and button fills

# -----------------------------------------------------------------------------
# Diagnostics and version control
# -----------------------------------------------------------------------------
status:
  error: oklch(0.665 0.205 20)
  warning: oklch(0.800 0.150 78) # gold
  info: oklch(0.740 0.110 262)
  success: oklch(0.780 0.150 158)

vcs:
  added: oklch(0.760 0.150 158)
  modified: oklch(0.820 0.140 85) # gold
  deleted: oklch(0.700 0.190 22)
  conflicting: oklch(0.720 0.175 40)
  ignored: oklch(0.530 0.030 285)
  untracked: oklch(0.720 0.130 158)

# -----------------------------------------------------------------------------
# Bracket pair colourisation
#
# Six stops spread across hue and lightness, opening on gold so the outermost
# pair is the one that reads first.
# -----------------------------------------------------------------------------
bracket:
  one: oklch(0.850 0.140 88)
  two: oklch(0.720 0.180 332)
  three: oklch(0.800 0.120 208)
  four: oklch(0.740 0.180 40)
  five: oklch(0.870 0.140 165)
  six: oklch(0.760 0.140 272)

# -----------------------------------------------------------------------------
# Terminal ANSI
#
# Derived from Nebula's own hues; every colour clears 4.5:1 on surface.deep.
# -----------------------------------------------------------------------------
ansi:
  # ANSI black cannot reach AA on a dark ground without ceasing to be black, so
  # it is held to the documented `dim` floor in src/a11y.yml instead — high
  # enough that anything printing in black is unambiguously visible.
  black: oklch(0.465 0.030 290)
  # brightBlack is what CLI tools reach for when they print dim body text, so it
  # is held to full AA.
  brightBlack: oklch(0.600 0.032 290)
  red: oklch(0.665 0.205 20)
  green: oklch(0.760 0.150 158)
  yellow: oklch(0.820 0.140 85)
  blue: oklch(0.700 0.150 265)
  magenta: oklch(0.690 0.180 332)
  cyan: oklch(0.720 0.110 200)
  white: oklch(0.880 0.014 288)
  brightRed: oklch(0.740 0.190 25)
  brightGreen: oklch(0.870 0.150 158)
  brightYellow: oklch(0.900 0.130 88)
  brightBlue: oklch(0.790 0.130 265)
  brightMagenta: oklch(0.790 0.160 332)
  brightCyan: oklch(0.830 0.110 200)
  brightWhite: oklch(0.975 0.008 288)
