# Welcome Page
walkThrough.embeddedEditorBackground: surface.deep                                 # Background color for the embedded editors on the Interactive Playground

# Setting Editor
settings.headerForeground: text.default                                      # The foreground color for a section header or active title
# DEAD KEY — removed from VS Code. settings.modifiedItemIndicator (set below)
# is the surviving key and already carries this colour.
# settings.modifiedItemForeground: hue.orange
settings.modifiedItemIndicator: hue.orange                                  # The color of the line that indicates a modified setting
settings.dropdownBackground: surface.deep                                  # Dropdown background
settings.dropdownForeground: text.default                                      # Dropdown foreground
settings.dropdownBorder: surface.sunken                                # Dropdown border
settings.checkboxBackground: surface.deep                                  # Checkbox background
settings.checkboxForeground: text.default                                      # Checkbox foreground
settings.checkboxBorder: surface.sunken                                # Checkbox border
settings.textInputBackground: surface.deep                                  # Text input box background
settings.textInputForeground: text.default                                      # Text input box foreground
settings.textInputBorder: surface.sunken                                # Text input box border
settings.numberInputBackground: surface.deep                                  # Number input box background
settings.numberInputForeground: text.default                                      # Number input box foreground
settings.numberInputBorder: surface.sunken                                # Number input box border

# Breadcrumbs
breadcrumb.foreground: text.subtle                                               # Color of breadcrumb items
breadcrumb.background: surface.base
breadcrumb.focusForeground: text.default                                               # Color of focused breadcrumb items
breadcrumb.activeSelectionForeground: text.default                                     # Color of selected breadcrumb items
breadcrumbPicker.background: surface.deep                                          # Background color of breadcrumb item picker

# Misc

listFilterWidget.background: surface.raised                                         # Background color of the type filter widget in lists and trees.
listFilterWidget.outline: surface.overlay                                          # Outline color of the type filter widget in lists and trees.
listFilterWidget.noMatchesOutline: hue.auburn                                    # Outline color of the type filter widget in lists and trees, when there are no matches.

