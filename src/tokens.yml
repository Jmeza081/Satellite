# =============================================================================
# Satellite — palette source of truth
# =============================================================================
#
# Every colour in the theme resolves back to a token declared here. Nothing in
# ui.yml or syntax.yml may contain a raw hex value, so a palette change is a
# change to this file alone.
#
# Colours are authored in OKLCH: oklch(<lightness> <chroma> <hue>)
#
#   lightness  0..1     perceptual, not sRGB brightness
#   chroma     0..0.4   saturation; reduced automatically if out of sRGB gamut
#   hue        0..360   degrees
#
# -----------------------------------------------------------------------------
# THE LADDER
# -----------------------------------------------------------------------------
# Hues are inherited from the 2019 palette — the warm/cool grammar that makes
# the theme recognisable is unchanged, and the editor ground is still #1A262E.
# What changed is that lightness is now *assigned* rather than incidental.
#
# This matters because of colour vision deficiency. Around 1 in 12 men has some
# form of it, and under simulation hue differences collapse while lightness
# differences survive. The 2019 palette put variables at L 0.741 and constants
# at L 0.739 — near-identical lightness — so under tritanopia they measured
# deltaE 1.1 apart: effectively one colour. Six other pairs collapsed similarly.
#
# So every pair of roles that appears adjacent in real code is now separated by
# lightness as well as hue. src/a11y.yml declares those pairs and
# `yarn verify` fails the build if any of them drifts back together.
#
# Reading order, dimmest to brightest:
#
#   0.430  text.faint        indent guides           decorative
#   0.640  text.subtle       comments                recede, but legible
#   0.680  role.type         types                   + italic
#   0.680  role.tag          JSX/HTML tags
#   0.700  role.constant     numbers, constants
#   0.745  role.punctuation  braces, semicolons      structural, quiet
#   0.795  role.function     calls and declarations
#   0.800  role.variable     identifiers             near-foreground
#   0.880  role.keyword      keywords, storage
#   0.895  role.string       string literals
#   0.945  text.default      plain text
#
# The three values in the middle of that list are tightly constrained. Comments,
# punctuation and identifiers are all low-chroma and land within 0.16 lightness
# of each other, which is exactly the situation that collapses under simulation.
# They were solved together by search rather than by eye; moving any one of them
# is likely to break one of the other two, and `yarn verify` will say so.
# =============================================================================

# -----------------------------------------------------------------------------
# Surfaces
#
# All five sit on the same 238° axis. The 2019 palette drifted between 218° and
# 279°, which is why some panels read slightly purple next to the editor.
# -----------------------------------------------------------------------------
surface:
  deep: oklch(0.205 0.020 236) # activity bar, side bar, panel, terminal, widgets
  base: oklch(0.261 0.022 238) # editor — unchanged from 2019 (#1A262E)
  raised: oklch(0.300 0.024 238) # active tab, dropdowns, hover states
  overlay: oklch(0.336 0.026 238) # selected rows, badges, sticky scroll

border:
  # The dark seam between panels. Satellite has always separated the activity
  # bar, side bar and panel with a line darker than either surface rather than
  # a lighter one, and that is a large part of how the theme reads. Kept.
  seam: oklch(0.150 0.016 238)
  soft: oklch(0.330 0.024 238) # hairlines within a surface
  strong: oklch(0.460 0.026 238) # visible boundaries where 1.4.11 applies

# -----------------------------------------------------------------------------
# Washes — translucent fills. Alpha is a hex byte, as in VS Code's #RRGGBBAA.
# -----------------------------------------------------------------------------
wash:
  selection: alpha(accent.base, 3D) # editor and workbench text selection
  selectionSoft: alpha(accent.base, 22) # other occurrences of the selection
  lineHighlight: alpha(text.default, 0C) # the line under the cursor
  dropTarget: alpha(accent.base, 33) # drag-and-drop targets
  findMatch: alpha(accent.base, 66) # the current search hit
  findOther: alpha(accent.base, 2E) # the other search hits
  rangeHighlight: alpha(accent.base, 1F) # quick-open and find ranges
  added: alpha(vcs.added, 26)
  deleted: alpha(vcs.deleted, 26)
  modified: alpha(vcs.modified, 26)

# -----------------------------------------------------------------------------
# Text
# -----------------------------------------------------------------------------
text:
  # 13.2:1. Pure #FFFFFF measured 15.4:1 but haloes against a low-chroma dark
  # ground; this reads calmer over long sessions and still clears AAA.
  default: oklch(0.945 0.008 230)
  muted: oklch(0.780 0.018 225) # secondary UI text, section headers
  subtle: oklch(0.640 0.045 195) # comments and line numbers — was 2.39:1, now 4.7:1
  faint: oklch(0.430 0.026 220) # indent guides and whitespace (decorative)

# -----------------------------------------------------------------------------
# Syntax roles
#
# One token per role. Where two roles shared a hue in 2019 they are now split by
# lightness; see the ladder above.
# -----------------------------------------------------------------------------
role:
  # Structural punctuation used to be gold, the same as keywords, which made
  # every brace and semicolon shout as loudly as `return`. A neutral slate is
  # what lets keywords read as keywords.
  punctuation: oklch(0.745 0.030 240)

  # The most common token in any file, so it sits close to plain text rather
  # than carrying a loud hue of its own. Keeps the 2019 auburn tint.
  variable: oklch(0.800 0.070 22)

  string: oklch(0.895 0.150 158)
  keyword: oklch(0.880 0.135 82)
  function: oklch(0.795 0.125 215)

  # Split from function, which it shared in 2019. Carries italic as a second,
  # non-colour cue, since teal and cyan stay close under every simulation.
  type: oklch(0.680 0.105 188)

  constant: oklch(0.700 0.180 38)
  # Chroma is pushed harder than the other roles. Tags and functions are the
  # tightest pair in the palette: in JSX they sit inches apart
  # (`<Button onClick={handleClick}>`), both are word-shaped so glyph shape is
  # no help, and under deuteranopia magenta and cyan both lose most of their
  # separation. Extra chroma here buys deltaE 13 -> 19 against the function
  # cyan at the same lightness and contrast.
  tag: oklch(0.680 0.220 325)
  regexp: oklch(0.940 0.115 120)
  invalid: oklch(0.665 0.205 22)

# -----------------------------------------------------------------------------
# Accent — the sea green that makes a screenshot recognisably Satellite
#
# Two stops. The 2019 palette had one, at a lightness that could neither hold
# white text as a fill (3.57:1) nor be read as text itself (4.32:1).
# -----------------------------------------------------------------------------
accent:
  base: oklch(0.700 0.110 194) # cursor, links, active borders, focus rings
  solid: oklch(0.480 0.095 194) # status bar and button fills — holds text.default at 5.3:1

# -----------------------------------------------------------------------------
# Diagnostics and version control
# -----------------------------------------------------------------------------
status:
  error: oklch(0.665 0.205 22)
  warning: oklch(0.780 0.150 70)
  info: oklch(0.740 0.110 235)
  success: oklch(0.780 0.150 158)

vcs:
  added: oklch(0.760 0.150 158)
  modified: oklch(0.800 0.135 82)
  deleted: oklch(0.700 0.190 22)
  conflicting: oklch(0.720 0.170 38)
  ignored: oklch(0.520 0.020 225)
  untracked: oklch(0.720 0.130 158)

# -----------------------------------------------------------------------------
# Bracket pair colourisation
#
# Six stops, spread across hue *and* lightness so nesting stays readable under
# colour-vision simulation as well as normal vision.
# -----------------------------------------------------------------------------
bracket:
  one: oklch(0.850 0.130 82)
  two: oklch(0.720 0.170 325)
  three: oklch(0.800 0.120 215)
  four: oklch(0.740 0.170 38)
  five: oklch(0.870 0.140 158)
  six: oklch(0.750 0.140 255)

# -----------------------------------------------------------------------------
# Terminal ANSI
#
# Derived from Satellite's own hues. The 2019 set was Dracula's, unmodified —
# purple, pink and lime against a teal-blue ground, with ansiBlack at 1.08:1
# against the terminal background, meaning anything printing in black printed
# nothing. Every colour below clears 4.5:1 on surface.deep.
#
# Blue is the one genuinely new hue: the 2019 palette had no true blue, so
# Dracula's #BD93F9 was doing double duty as both blue and magenta.
# -----------------------------------------------------------------------------
ansi:
  # ANSI black is the one colour that cannot reach AA on a dark ground without
  # ceasing to be black. It is raised far enough to be clearly visible — the
  # 2019 value was 1.08:1, meaning anything printing in black printed nothing —
  # and is checked against a documented lower floor rather than the AA
  # threshold. See the `dim` level in src/a11y.yml.
  black: oklch(0.470 0.024 238)
  # brightBlack is what CLI tools reach for when they print dim body text
  # (timestamps, hints, secondary output), so it is held to full AA.
  brightBlack: oklch(0.600 0.026 238)
  red: oklch(0.665 0.205 22)
  green: oklch(0.760 0.150 158)
  yellow: oklch(0.820 0.135 82)
  blue: oklch(0.680 0.150 255)
  magenta: oklch(0.680 0.175 325)
  cyan: oklch(0.720 0.110 196)
  white: oklch(0.880 0.012 230)
  brightRed: oklch(0.740 0.190 22)
  brightGreen: oklch(0.870 0.150 158)
  brightYellow: oklch(0.900 0.130 82)
  brightBlue: oklch(0.780 0.130 255)
  brightMagenta: oklch(0.780 0.160 325)
  brightCyan: oklch(0.830 0.110 196)
  brightWhite: oklch(0.975 0.006 230)
